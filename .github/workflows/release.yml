name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages to npm after all gates pass
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      core_ref:
        description: Exact docxkit-cli-core commit, tag, or branch to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docxkit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-core-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dztabel-happy/docxkit-cli-core
          ref: ${{ inputs.core_ref }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Resolve immutable core commit
        id: resolve
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-platform:
    needs: resolve-core-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            rid: osx-arm64
            platform_dir: darwin-arm64
            boundary: darwin
            binary: docx-kit
          - runner: windows-latest
            rid: win-x64
            platform_dir: win32-x64
            boundary: win32
            binary: docx-kit.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dztabel-happy/docxkit-cli-core
          ref: ${{ needs.resolve-core-ref.outputs.sha }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Checkout public wrapper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: wrapper
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Release metadata gate
        shell: bash
        run: node scripts/check_release_metadata.mjs wrapper
      - name: Build platform binary
        shell: bash
        run: bash scripts/build_binary.sh "${{ matrix.rid }}"
      - name: Binary smoke test
        shell: bash
        run: "./dist/${{ matrix.rid }}/${{ matrix.binary }} --version"
      - name: Stage binary into public package
        shell: bash
        run: |
          cp "dist/${{ matrix.rid }}/${{ matrix.binary }}" "wrapper/npm/platform-packages/${{ matrix.platform_dir }}/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            chmod +x "wrapper/npm/platform-packages/${{ matrix.platform_dir }}/${{ matrix.binary }}"
          fi
      - name: Package boundary gate
        shell: bash
        run: node scripts/check_package_boundary.mjs wrapper main "${{ matrix.boundary }}"
      - name: Packed install smoke test
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/docxkit-packages"
          install_dir="$RUNNER_TEMP/docxkit-install"
          mkdir -p "$pack_dir" "$install_dir"
          (cd wrapper && npm pack --pack-destination "$pack_dir" >/dev/null)
          (cd "wrapper/npm/platform-packages/${{ matrix.platform_dir }}" && npm pack --pack-destination "$pack_dir" >/dev/null)
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$pack_dir"/*.tgz >/dev/null
          cat > content.md <<'EOF'
          ---
          title: DocxKit 公开构建验收
          template: executive-cn-official-docx
          ---

          # 一级标题

          正文内容。
          EOF
          npx --no-install docx-kit --version
          npx --no-install docx-kit build content.md --out output --filename 公开构建验收.docx >/dev/null
          test -f output/公开构建验收.docx
          npx --no-install docx-kit qa output/公开构建验收.docx --report-json output/report.json --out output/qa >/dev/null
      - name: Hand the platform binary to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-binary-${{ matrix.platform_dir }}
          path: dist/${{ matrix.rid }}/${{ matrix.binary }}
          retention-days: 1
          if-no-files-found: error

  publish-packages:
    # 平台包与主包一律在这里统一发布：任何一个平台构建失败都不会有包落地，
    # 版本号因此可以原样重试（2026-09 有一次 windows 发布失败前 darwin 包已上架，
    # 重跑时二进制无法逐字节复现、integrity 守卫拒绝覆盖，那个版本号只能作废）。
    needs: [resolve-core-ref, build-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: dztabel-happy/docxkit-cli-core
          ref: ${{ needs.resolve-core-ref.outputs.sha }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Checkout public wrapper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: wrapper
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Collect platform binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: platform-binary-*
          path: platform-binaries
      - name: Stage binaries into public packages
        shell: bash
        run: |
          cp platform-binaries/platform-binary-darwin-arm64/docx-kit wrapper/npm/platform-packages/darwin-arm64/docx-kit
          cp platform-binaries/platform-binary-win32-x64/docx-kit.exe wrapper/npm/platform-packages/win32-x64/docx-kit.exe
          # artifact 不保留权限位，重新赋予可执行权限（npm 打包会带上文件模式）
          chmod +x wrapper/npm/platform-packages/darwin-arm64/docx-kit
      - name: Release gates
        run: |
          node scripts/check_release_metadata.mjs wrapper
          node scripts/check_package_boundary.mjs wrapper main darwin win32
      - name: Publish packages
        if: inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/publish_npm_packages.mjs \
            wrapper/npm/platform-packages/darwin-arm64 \
            wrapper/npm/platform-packages/win32-x64 \
            wrapper
      - name: Rehearse publish
        if: inputs.publish != 'true'
        run: |
          node scripts/publish_npm_packages.mjs --dry-run \
            wrapper/npm/platform-packages/darwin-arm64 \
            wrapper/npm/platform-packages/win32-x64 \
            wrapper
